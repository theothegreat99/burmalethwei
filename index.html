<style>
:root{--r:#b3121b;--r2:#d4141c;--bg:#f1e3b6;--ink:#15100c;--paper:#e8d596;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.h::after{content:"";width:90px;height:7px;background:var(--r);margin-left:6px;filter:url(#rough);transform:skewX(-25deg)}
.lead{max-width:720px;font-size:18px}

.c{background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:22px;position:relative;overflow:hidden;transition:.3s;box-shadow:5px 5px 0 var(--ink)}
.c::before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;background:radial-gradient(#b3121b88,transparent 65%);filter:url(#rough)}
.c:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--r)}
.c h3{margin:12px 0 6px;font-size:20px}.c p{margin:0}
.full{margin-top:14px!important;padding-top:14px;border-top:2px dotted var(--ink);font-size:15px}
.rules{counter-reset:n}.rl{counter-increment:n;display:flex;gap:14px;align-items:flex-start}
.rl::before{content:counter(n,decimal-leading-zero);font:400 34px/1 Rye,serif;color:var(--r);text-shadow:2px 2px 0 var(--ink)}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:30px}
.pic{height:210px;border-radius:6px;position:relative;overflow:hidden;display:grid;place-items:center;border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:radial-gradient(circle at 50% 115%,var(--a,#b3121b),transparent 62%),repeating-linear-gradient(45deg,#15100c22 0 2px,transparent 2px 16px),repeating-linear-gradient(-45deg,#15100c22 0 2px,transparent 2px 16px),var(--paper)}
.pic .ic{width:120px;height:120px}
.pic::after{content:"";position:absolute;inset:auto -20px -18px;height:36px;background:var(--ink);filter:url(#rough);opacity:.9}
.soon{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;border:3px dashed var(--ink);border-radius:10px;padding:34px;background:linear-gradient(120deg,#b3121b33,var(--paper))}
.soon .ic{width:110px;height:110px}
.badge{display:inline-block;background:var(--ink);color:#f1e3b6;padding:3px 14px;border-radius:99px;font-weight:600;font-size:13px;letter-spacing:.15em;text-transform:uppercase;animation:pl 2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px #b3121b66}}
.lock{display:flex;gap:10px;margin-top:16px}.lock i{height:10px;flex:1;border-radius:6px;background:linear-gradient(90deg,var(--paper),var(--r),var(--paper));background-size:200%;animation:sh 2.4s linear infinite;border:1px solid var(--ink)}
@keyframes sh{to{background-position:-200% 0}}
footer{text-align:center;padding:50px 5vw 70px;border-top:2px solid var(--ink)}footer p{margin:0 0 16px}
.sp{position:absolute;border-radius:50%;background:radial-gradient(#d4141c,#7a0a10 70%,transparent);filter:url(#rough);pointer-events:none;opacity:.45}
.rv{opacity:0;transform:translateY(26px);transition:1s}.rv.on{opacity:1;transform:none}
@media(max-width:900px){nav{display:none}header{gap:10px}.hero{grid-template-columns:1fr;min-height:0}.tiles{grid-template-columns:1fr 1fr}.soon{grid-template-columns:1fr}.cof span{display:none}header .cof{margin-left:auto}}

en:"Myanmar’s Fighting Legacy|More than a fight. A culture. A people. A legacy.|Origin|Rules|Trends|Articles|Learn|Explore Lethwei|Coming soon|Origin|Lethwei grew from the battlefields of ancient Burmese kingdoms more than a thousand years ago. Soldiers trained it to fight without weapons, and villages turned it into festival sport.|Rules|Nine limbs: fists, elbows, knees, shins, feet and head|Bare hands, wrapped only in gauze and tape|Headbutts are legal, the signature of Lethwei|Modern bouts: 5 rounds of 3 minutes|Win by knockout or doctor’s stoppage|Traditionally, no knockout means a draw|Trends|Today Lethwei is going global: international promotions, streamed events, foreign fighters and new gyms in Yangon and abroad.|Articles|The nine limbs|Fists, elbows, knees, shins, feet and head make Lethwei one of the most complete striking arts.|The Lethwei Yay dance|Before the bell, fighters perform a ritual dance to show respect and spirit.|Fight and festival|Bouts are tied to pagoda festivals and New Year (Thingyan) celebrations.|Learn Lethwei|Lessons, drills and history courses are coming soon.|Buy me a coffee|Enjoyed this? Support the project.|Lethwei is often called the Art of Nine Limbs. Alongside fists, elbows, knees, shins and feet, fighters may use the head, which sets it apart from its Southeast Asian cousins that count eight limbs. Because fighters wear only wraps, not gloves, every strike lands with full force, and fights often end in knockouts. Lethwei rewards courage, timing and a strong chin.|Before a bout, fighters perform the Lethwei Yay, a ritual dance in the ring. Through set movements they show respect to their teachers, ancestors and the crowd, and they calm and focus the mind. For many fans it matters as much as the fight itself, a reminder that Lethwei is a tradition and not just a sport.|Lethwei has long lived beside community life. Bouts were the highlight of pagoda festivals and New Year (Thingyan) celebrations, when villagers gathered to cheer their local heroes. Fighters were respected as champions of their town, and a win brought pride to a whole village. Today’s big events echo that atmosphere, with live traditional music, ritual and crowds, now with cameras and a global audience.",
my:"မြန်မာ့ တိုက်ခိုက်ရေး အမွေအနှစ်|ထိုးသတ်ပွဲတစ်ခုထက်မက။ ယဉ်ကျေးမှု၊ လူမျိုး၊ အမွေအနှစ်။|မူလအစ|စည်းမျဉ်း|လမ်းကြောင်းသစ်|ဆောင်းပါး|လေ့လာရန်|လက်ဝှေ့ကို လေ့လာပါ|မကြာမီ လာမည်|မူလအစ|လက်ဝှေ့သည် လွန်ခဲ့သော နှစ်တစ်ထောင်ကျော်က ရှေးမြန်မာတိုင်းနိုင်ငံများ၏ စစ်မြေပြင်မှ ပေါ်ပေါက်ခဲ့သည်။ စစ်သားများက လက်နက်မဲ့ တိုက်ခိုက်ရန် လေ့ကျင့်ခဲ့ပြီး ရွာများက ပွဲတော်အားကစားအဖြစ် ဆက်လက်ထိန်းသိမ်းခဲ့သည်။|စည်းမျဉ်း|ကိုယ်အင်္ဂါ ကိုးမျိုး - လက်သီး၊ တံတောင်၊ ဒူး၊ ခြေသလုံး၊ ခြေနှင့် ခေါင်း|လက်ဗလာ - ပတ်တီးနှင့် တိပ်ကိုသာ ပတ်ထားသည်|ခေါင်းဖြင့် ဆောင့်ခြင်းကို ခွင့်ပြုသည် - လက်ဝှေ့၏ အမှတ်လက္ခဏာ|ခေတ်သစ်ပွဲများ - ၃ မိနစ် ၅ ပတ်|ထိုးနှက်ချ သို့မဟုတ် ဆရာဝန်ရပ်တန့်၍ အနိုင်ရသည်|ရိုးရာအရ ထိုးနှက်မချနိုင်လျှင် သရေကျသည်|လမ်းကြောင်းသစ်|ယနေ့ လက်ဝှေ့သည် ကမ္ဘာသို့ ပျံ့နှံ့လာသည်။ နိုင်ငံတကာ ပွဲစီစဉ်သူများ၊ တိုက်ရိုက်ထုတ်လွှင့်မှု၊ နိုင်ငံခြားသား ယှဉ်ပြိုင်သူများနှင့် ရန်ကုန်နှင့် ပြည်ပရှိ အားကစားရုံသစ်များ ပေါ်ပေါက်လာသည်။|ဆောင်းပါး|ကိုယ်အင်္ဂါ ကိုးမျိုး|လက်သီး၊ တံတောင်၊ ဒူး၊ ခြေသလုံး၊ ခြေနှင့် ခေါင်းတို့ကြောင့် လက်ဝှေ့သည် အပြည့်စုံဆုံး တိုက်ခိုက်ရေးပညာတစ်ခု ဖြစ်သည်။|ပွဲမတိုင်မီ အက|ခေါင်းလောင်းမတီးမီ တိုက်ခိုက်သူများသည် လေးစားမှုနှင့် စိတ်ဓာတ်ပြရန် အစဉ်အလာ အက ကကြသည်။|တိုက်ပွဲနှင့် ပွဲတော်|ပွဲများကို ဘုရားပွဲတော်များနှင့် သင်္ကြန်ပွဲတော်တွင် ကျင်းပလေ့ရှိသည်။|လက်ဝှေ့ သင်ယူရန်|သင်ခန်းစာများ၊ လေ့ကျင့်ခန်းများနှင့် သမိုင်းသင်တန်းများ မကြာမီ လာမည်။|ကော်ဖီတစ်ခွက် ဝယ်ပေးပါ|ကြိုက်နှစ်သက်ပါသလား။ စီမံကိန်းကို ထောက်ပံ့ပါ။|လက်ဝှေ့ကို ကိုယ်အင်္ဂါ ကိုးမျိုး၏ အနုပညာဟု မကြာခဏ ခေါ်ကြသည်။ လက်သီး၊ တံတောင်၊ ဒူး၊ ခြေသလုံးနှင့် ခြေအပြင် ခေါင်းကိုပါ အသုံးပြုနိုင်သဖြင့် အင်္ဂါရှစ်မျိုးသာ ရေတွက်သော အိမ်နီးချင်း တိုက်ခိုက်ရေးပညာများနှင့် ကွဲပြားသည်။ လက်အိတ်မပါဘဲ ပတ်တီးသာ ပတ်ထားသောကြောင့် ထိုးချက်တိုင်း အပြည့်အဝ ထိမှန်ပြီး ပွဲများ ထိုးနှက်ချဖြင့် အဆုံးသတ်လေ့ရှိသည်။ လက်ဝှေ့သည် ရဲစွမ်းသတ္တိ၊ အချိန်ကိုက်မှုနှင့် ခံနိုင်ရည်ကို တန်ဖိုးထားသည်။|ပွဲမစမီ တိုက်ခိုက်သူများသည် ကွင်းထဲတွင် Lethwei Yay ဟု ခေါ်သော ဓလေ့အက ကကြသည်။ သတ်မှတ်ထားသော လှုပ်ရှားမှုများဖြင့် ဆရာများ၊ ဘိုးဘွားများနှင့် ပရိသတ်ကို လေးစားမှုပြပြီး စိတ်ကို တည်ငြိမ်စေကာ အာရုံစိုက်စေသည်။ ပရိသတ်အတော်များအတွက် ၎င်းသည် ပွဲကဲ့သို့ပင် အရေးပါပြီး လက်ဝှေ့သည် အားကစားတစ်ခုသာမက အစဉ်အလာတစ်ခုဖြစ်ကြောင်း သတိပေးသည်။|လက်ဝှေ့သည် အသိုင်းအဝိုင်းဘဝနှင့် နီးကပ်စွာ ရှင်သန်ခဲ့သည်။ ဘုရားပွဲတော်များနှင့် သင်္ကြန်ပွဲတော်များတွင် ရွာသူရွာသားများ စုရုံးကာ ဒေသခံ ရဲရင့်သူများကို အားပေးရာ ပွဲများသည် အထူးအချိန်ဖြစ်ခဲ့သည်။ ကစားသမားများသည် မြို့ရွာ၏ ချန်ပီယံအဖြစ် လေးစားခံရပြီး အနိုင်ရခြင်းက ရွာတစ်ရွာလုံးကို ဂုဏ်ယူစေသည်။ ယနေ့ပွဲကြီးများတွင်လည်း ရိုးရာဂီတ၊ ဓလေ့များနှင့် ပရိသတ်များ ရှိနေဆဲဖြစ်ပြီး ကင်မရာများနှင့် ကမ္ဘာ့ပရိသတ်များပါ ပါဝင်လာသည်။",
zh:"缅甸的格斗传承|不止是一场比赛。是文化、是人民、是传承。|起源|规则|趋势|文章|学习|探索缅甸拳|即将上线|起源|缅甸拳（Lethwei）诞生于一千多年前古代缅甸王国的战场。士兵以此练习徒手搏斗，村庄则把它变成节庆竞技。|规则|九肢并用：拳、肘、膝、胫、脚、头|徒手比赛，仅缠纱布和胶带|允许头槌，这是缅甸拳的标志|现代比赛：5回合，每回合3分钟|以击倒或医生叫停获胜|传统规则下，无人被击倒即为平局|趋势|如今缅甸拳正走向世界：国际赛事、直播、外国选手，以及仰光和海外不断涌现的新拳馆。|文章|九肢艺术|拳、肘、膝、胫、脚、头，让缅甸拳成为最完整的击打技术之一。|赛前舞蹈|开赛前，选手跳仪式舞蹈，表达敬意与斗志。|比赛与节庆|比赛与佛塔庙会和缅甸新年泼水节（Thingyan）紧密相连。|学习缅甸拳|课程、训练和历史专题即将推出。|请我喝杯咖啡|喜欢吗？支持这个项目吧。|缅甸拳常被称为“九肢艺术”。除了拳、肘、膝、胫和脚，选手还可以用头，这使它不同于只计八肢的东南亚近亲。由于选手只缠绷带、不戴拳套，每一击都全力落下，比赛常以击倒收场。缅甸拳考验的是勇气、时机和极强的抗击打能力。|赛前，选手会在场上跳一段名为“Lethwei Yay”的仪式舞。通过固定的动作，他们向老师、祖先和观众致敬，也让心神平静、专注。对许多观众来说，它与比赛本身同样重要，提醒人们缅甸拳是一种传统，而不只是运动。|缅甸拳长期与社区生活相伴。在佛塔庙会和缅甸新年泼水节（Thingyan）上，村民聚在一起，为本地英雄喝彩，比赛是庆典的高潮。选手被视为家乡的冠军，胜利为全村带来荣耀。如今的大型赛事仍延续这种氛围：传统现场音乐、仪式和人群，只是多了摄像机和全球观众。",
ru:"Боевое наследие Мьянмы|Больше чем бой. Культура. Народ. Наследие.|Истоки|Правила|Тренды|Статьи|Учиться|Узнать о летвее|Скоро|Истоки|Летвей родился на полях сражений древних бирманских королевств более тысячи лет назад. Воины учились им драться без оружия, а деревни превратили его в праздничный спорт.|Правила|Девять конечностей: кулаки, локти, колени, голени, стопы и голова|Голые руки, обмотанные лишь бинтом и лентой|Удары головой разрешены, это визитная карточка летвея|Современные бои: 5 раундов по 3 минуты|Победа нокаутом или по остановке врачом|По традиции без нокаута засчитывается ничья|Тренды|Сегодня летвей выходит на мировой уровень: международные промоушены, трансляции, иностранные бойцы и новые залы в Янгоне и за рубежом.|Статьи|Девять конечностей|Кулаки, локти, колени, голени, стопы и голова делают летвей одним из самых полных ударных искусств.|Танец летвей яй|Перед гонгом бойцы исполняют ритуальный танец в знак уважения и боевого духа.|Бой и праздник|Бои связаны с храмовыми праздниками и Новым годом (Тинджан).|Учиться летвею|Уроки, тренировки и курсы по истории скоро появятся.|Угостить кофе|Понравилось? Поддержите проект.|Летвей часто называют искусством девяти конечностей. Помимо кулаков, локтей, коленей, голеней и стоп, бойцы могут бить головой, и этим он отличается от родственных боевых искусств Юго-Восточной Азии, где насчитывают восемь конечностей. Бойцы выходят только в бинтах, без перчаток, поэтому каждый удар приходит в полную силу, и бои часто заканчиваются нокаутом. Летвей ценит смелость, чувство времени и крепкую челюсть.|Перед боем бойцы исполняют летвей яй — ритуальный танец на ринге. Через заданные движения они выражают уважение учителям, предкам и зрителям, а также успокаивают разум и собираются. Для многих зрителей он важен не меньше самого боя и напоминает, что летвей — это традиция, а не только спорт.|Летвей давно связан с жизнью общины. Бои были кульминацией храмовых праздников и празднования Нового года (Тинджан): жители деревни собирались поддержать местных героев. Бойцов уважали как чемпионов города, а победа приносила гордость всей деревне. Сегодняшние большие турниры сохраняют эту атмосферу: живая традиционная музыка, ритуалы и толпа, только теперь ещё и камеры и мировая аудитория.",
de:"Myanmars Kampfkunst-Erbe|Mehr als ein Kampf. Eine Kultur. Ein Volk. Ein Erbe.|Ursprung|Regeln|Trends|Artikel|Lernen|Lethwei entdecken|Bald verfügbar|Ursprung|Lethwei entstand vor mehr als tausend Jahren auf den Schlachtfeldern alter burmesischer Königreiche. Soldaten übten damit den Kampf ohne Waffen, Dörfer machten daraus einen Festsport.|Regeln|Neun Gliedmaßen: Fäuste, Ellbogen, Knie, Schienbeine, Füße und Kopf|Bloße Hände, nur mit Mull und Tape umwickelt|Kopfstöße sind erlaubt, das Markenzeichen von Lethwei|Moderne Kämpfe: 5 Runden à 3 Minuten|Sieg durch K. o. oder Arztabbruch|Traditionell bedeutet kein K. o. ein Unentschieden|Trends|Heute geht Lethwei um die Welt: internationale Veranstalter, Livestreams, ausländische Kämpfer und neue Gyms in Yangon und weltweit.|Artikel|Die neun Gliedmaßen|Fäuste, Ellbogen, Knie, Schienbeine, Füße und Kopf machen Lethwei zu einer der vollständigsten Schlagkünste.|Der Lethwei-Yay-Tanz|Vor dem Gong führen die Kämpfer einen rituellen Tanz auf, aus Respekt und Kampfgeist.|Kampf und Fest|Kämpfe gehören zu Pagodenfesten und zum Neujahrsfest (Thingyan).|Lethwei lernen|Lektionen, Übungen und Geschichtskurse kommen bald.|Spendier mir einen Kaffee|Gefällt dir das? Unterstütze das Projekt.|Lethwei wird oft die Kunst der neun Gliedmaßen genannt. Neben Fäusten, Ellbogen, Knien, Schienbeinen und Füßen darf auch der Kopf eingesetzt werden, was es von verwandten südostasiatischen Kampfkünsten unterscheidet, die acht Gliedmaßen zählen. Weil die Kämpfer nur Bandagen und keine Handschuhe tragen, kommt jeder Schlag mit voller Wucht, und Kämpfe enden oft durch K. o. Lethwei belohnt Mut, Timing und ein hartes Kinn.|Vor dem Kampf führen die Kämpfer im Ring den Lethwei Yay aus, einen rituellen Tanz. Mit festen Bewegungen erweisen sie ihren Lehrern, Vorfahren und dem Publikum Respekt und beruhigen und sammeln ihren Geist. Für viele Fans ist er so wichtig wie der Kampf selbst und erinnert daran, dass Lethwei eine Tradition ist, nicht nur ein Sport.|Lethwei war schon immer Teil des Gemeinschaftslebens. Kämpfe waren der Höhepunkt von Pagodenfesten und Neujahrsfeiern (Thingyan), bei denen die Dorfbewohner ihre lokalen Helden anfeuerten. Kämpfer galten als Champions ihrer Stadt, und ein Sieg machte ein ganzes Dorf stolz. Heutige Großveranstaltungen greifen diese Stimmung auf: mit traditioneller Livemusik, Ritualen und Publikum, nur eben mit Kameras und weltweitem Zuschauerkreis.",
fr:"L’héritage guerrier du Myanmar|Plus qu’un combat. Une culture. Un peuple. Un héritage.|Origines|Règles|Tendances|Articles|Apprendre|Découvrir le Lethwei|Bientôt|Origines|Le Lethwei est né il y a plus de mille ans sur les champs de bataille des anciens royaumes birmans. Les soldats s’y entraînaient à combattre sans arme, et les villages en ont fait un sport de fête.|Règles|Neuf armes : poings, coudes, genoux, tibias, pieds et tête|Mains nues, bandées seulement de gaze et de tape|Les coups de tête sont permis, signature du Lethwei|Combats modernes : 5 rounds de 3 minutes|Victoire par K.-O. ou arrêt médical|Traditionnellement, sans K.-O., c’est un match nul|Tendances|Aujourd’hui, le Lethwei conquiert le monde : organisations internationales, diffusion en direct, combattants étrangers et nouvelles salles à Yangon et ailleurs.|Articles|Les neuf armes|Poings, coudes, genoux, tibias, pieds et tête font du Lethwei l’un des arts de percussion les plus complets.|La danse Lethwei Yay|Avant la cloche, les combattants exécutent une danse rituelle par respect et pour affirmer leur esprit.|Combat et fête|Les combats accompagnent les fêtes de pagode et le Nouvel An (Thingyan).|Apprendre le Lethwei|Leçons, exercices et cours d’histoire arrivent bientôt.|Offrez-moi un café|Vous avez aimé ? Soutenez le projet.|Le Lethwei est souvent appelé l’art des neuf armes. En plus des poings, coudes, genoux, tibias et pieds, les combattants peuvent utiliser la tête, ce qui le distingue de ses cousins d’Asie du Sud-Est qui en comptent huit. Comme ils ne portent que des bandes, sans gants, chaque coup arrive de plein fouet et les combats finissent souvent par K.-O. Le Lethwei récompense le courage, le timing et une mâchoire solide.|Avant un combat, les combattants exécutent le Lethwei Yay, une danse rituelle sur le ring. Par des mouvements codifiés, ils rendent hommage à leurs maîtres, à leurs ancêtres et au public, et apaisent et concentrent leur esprit. Pour beaucoup de fans, elle compte autant que le combat lui-même et rappelle que le Lethwei est une tradition, pas seulement un sport.|Le Lethwei a toujours vécu au cœur de la vie des communautés. Les combats étaient le moment fort des fêtes de pagode et du Nouvel An (Thingyan), quand les villageois se rassemblaient pour acclamer leurs héros locaux. Les combattants étaient respectés comme champions de leur ville, et une victoire rendait tout un village fier. Les grands événements actuels en gardent l’ambiance, avec musique traditionnelle en direct, rituels et foule, mais désormais avec des caméras et un public mondial.",
es:"El legado guerrero de Myanmar|Más que una pelea. Una cultura. Un pueblo. Un legado.|Origen|Reglas|Tendencias|Artículos|Aprender|Explorar el Lethwei|Próximamente|Origen|El Lethwei nació hace más de mil años en los campos de batalla de los antiguos reinos birmanos. Los soldados lo practicaban para combatir sin armas y los pueblos lo convirtieron en deporte de fiesta.|Reglas|Nueve armas: puños, codos, rodillas, espinillas, pies y cabeza|Manos desnudas, solo con gasa y cinta|Los cabezazos son legales, la marca del Lethwei|Combates modernos: 5 asaltos de 3 minutos|Se gana por KO o detención médica|Tradicionalmente, sin KO es empate|Tendencias|Hoy el Lethwei se globaliza: promotoras internacionales, transmisiones en vivo, peleadores extranjeros y nuevos gimnasios en Yangon y el mundo.|Artículos|Las nueve armas|Puños, codos, rodillas, espinillas, pies y cabeza hacen del Lethwei uno de los artes de golpeo más completos.|La danza Lethwei Yay|Antes de la campana, los peleadores bailan un ritual en señal de respeto y espíritu.|Pelea y fiesta|Los combates acompañan las fiestas de pagoda y el Año Nuevo (Thingyan).|Aprende Lethwei|Lecciones, ejercicios y cursos de historia llegarán pronto.|Invítame un café|¿Te gustó? Apoya el proyecto.|El Lethwei suele llamarse el arte de las nueve armas. Además de puños, codos, rodillas, espinillas y pies, los peleadores pueden usar la cabeza, lo que lo distingue de sus parientes del sudeste asiático, que cuentan ocho. Como solo llevan vendas y no guantes, cada golpe llega con toda su fuerza y los combates suelen terminar en KO. El Lethwei premia el valor, el tiempo y una mandíbula de hierro.|Antes del combate, los peleadores ejecutan el Lethwei Yay, una danza ritual en el ring. Con movimientos establecidos, rinden respeto a sus maestros, a sus antepasados y al público, y calman y enfocan la mente. Para muchos aficionados es tan importante como la pelea misma y recuerda que el Lethwei es una tradición, no solo un deporte.|El Lethwei siempre ha vivido junto a la vida comunitaria. Los combates eran lo más esperado de las fiestas de pagoda y del Año Nuevo (Thingyan), cuando los aldeanos se reunían para animar a sus héroes locales. Los peleadores eran respetados como campeones de su pueblo y una victoria llenaba de orgullo a toda la aldea. Los grandes eventos de hoy conservan ese ambiente, con música tradicional en vivo, rituales y multitudes, ahora con cámaras y audiencias de todo el mundo.",
pt:"O legado de luta de Mianmar|Mais que uma luta. Uma cultura. Um povo. Um legado.|Origem|Regras|Tendências|Artigos|Aprender|Explorar o Lethwei|Em breve|Origem|O Lethwei nasceu há mais de mil anos nos campos de batalha dos antigos reinos birmaneses. Os soldados o praticavam para lutar sem armas e as aldeias o transformaram em esporte de festa.|Regras|Nove armas: punhos, cotovelos, joelhos, canelas, pés e cabeça|Mãos nuas, protegidas só por gaze e fita|Cabeçadas são permitidas, a marca do Lethwei|Lutas modernas: 5 rounds de 3 minutos|Vitória por nocaute ou parada médica|Tradicionalmente, sem nocaute é empate|Tendências|Hoje o Lethwei ganha o mundo: promotoras internacionais, transmissões ao vivo, lutadores estrangeiros e novas academias em Yangon e no exterior.|Artigos|As nove armas|Punhos, cotovelos, joelhos, canelas, pés e cabeça fazem do Lethwei uma das artes de golpes mais completas.|A dança Lethwei Yay|Antes do gongo, os lutadores fazem uma dança ritual de respeito e espírito.|Luta e festa|As lutas fazem parte das festas de pagode e do Ano Novo (Thingyan).|Aprenda Lethwei|Aulas, treinos e cursos de história chegam em breve.|Me pague um café|Gostou? Apoie o projeto.|O Lethwei costuma ser chamado de arte das nove armas. Além de punhos, cotovelos, joelhos, canelas e pés, os lutadores podem usar a cabeça, o que o diferencia de seus parentes do Sudeste Asiático, que contam oito. Como usam só ataduras, sem luvas, cada golpe chega com força total e as lutas costumam terminar em nocaute. O Lethwei premia coragem, timing e um queixo duro.|Antes da luta, os lutadores executam o Lethwei Yay, uma dança ritual no ringue. Com movimentos definidos, prestam respeito aos mestres, aos ancestrais e ao público, e acalmam e concentram a mente. Para muitos fãs, é tão importante quanto a luta em si e lembra que o Lethwei é uma tradição, não só um esporte.|O Lethwei sempre viveu junto à vida comunitária. As lutas eram o ponto alto das festas de pagode e do Ano Novo (Thingyan), quando os aldeões se reuniam para torcer por seus heróis locais. Os lutadores eram respeitados como campeões da cidade e uma vitória trazia orgulho a toda a aldeia. Os grandes eventos de hoje mantêm esse clima, com música tradicional ao vivo, rituais e multidões, agora com câmeras e público mundial.",
th:"มรดกการต่อสู้ของเมียนมา|มากกว่าการต่อสู้ คือวัฒนธรรม ผู้คน และมรดก|ต้นกำเนิด|กติกา|เทรนด์|บทความ|เรียนรู้|สำรวจเลทเวย์|เร็วๆ นี้|ต้นกำเนิด|เลทเวย์ถือกำเนิดบนสมรภูมิของอาณาจักรพม่าโบราณเมื่อกว่าพันปีก่อน ทหารฝึกไว้ต่อสู้มือเปล่า และชาวบ้านพัฒนาเป็นกีฬาในงานเทศกาล|กติกา|ใช้ศาสตร์เก้าอวัยวะ: หมัด ศอก เข่า แข้ง เท้า และศีรษะ|มือเปล่า พันด้วยผ้าก๊อซและเทปเท่านั้น|ใช้ศีรษะโขกได้ อันเป็นเอกลักษณ์ของเลทเวย์|การแข่งขันสมัยใหม่ 5 ยก ยกละ 3 นาที|ชนะด้วยการน็อกเอาต์หรือแพทย์สั่งหยุด|ตามประเพณี หากไม่มีการน็อกถือว่าเสมอ|เทรนด์|ปัจจุบันเลทเวย์ก้าวสู่เวทีโลก ทั้งรายการระดับนานาชาติ การถ่ายทอดสด นักสู้ต่างชาติ และค่ายใหม่ในย่างกุ้งและต่างประเทศ|บทความ|ศาสตร์เก้าอวัยวะ|หมัด ศอก เข่า แข้ง เท้า และศีรษะ ทำให้เลทเวย์เป็นศิลปะการต่อสู้ที่ครบเครื่องที่สุดแขนงหนึ่ง|รำก่อนชก|ก่อนระฆังดัง นักสู้ร่ายรำพิธีกรรมเพื่อแสดงความเคารพและจิตวิญญาณ|ศึกและเทศกาล|การชกผูกพันกับงานเทศกาลเจดีย์และปีใหม่ (ติงยาน)|เรียนรู้เลทเวย์|บทเรียน แบบฝึก และหลักสูตรประวัติศาสตร์ เร็วๆ นี้|เลี้ยงกาแฟฉันสักแก้ว|ถูกใจไหม? ช่วยสนับสนุนโปรเจกต์นี้|เลทเวย์มักถูกเรียกว่าศิลปะเก้าอวัยวะ นอกจากหมัด ศอก เข่า แข้ง และเท้า นักสู้ยังใช้ศีรษะได้ ซึ่งต่างจากศิลปะการต่อสู้ใกล้เคียงในเอเชียตะวันออกเฉียงใต้ที่นับแปดอวัยวะ เพราะนักสู้พันเพียงผ้าพันมือ ไม่สวมนวม ทุกหมัดจึงลงเต็มแรง และการชกมักจบด้วยการน็อก เลทเวย์ให้รางวัลกับความกล้า จังหวะ และคางที่แข็งแกร่ง|ก่อนการชก นักสู้จะร่ายรำพิธีกรรมที่เรียกว่าเลทเวย์ ยัย บนเวที ด้วยท่วงท่าที่กำหนดไว้ พวกเขาแสดงความเคารพต่อครู บรรพบุรุษ และผู้ชม พร้อมทั้งทำจิตใจให้สงบและมีสมาธิ สำหรับแฟนหลายคน การรำนี้สำคัญไม่แพ้การชกเอง และเตือนว่าเลทเวย์คือประเพณี ไม่ใช่แค่กีฬา|เลทเวย์อยู่คู่กับชีวิตชุมชนมาช้านาน การชกเป็นไฮไลต์ของงานเทศกาลเจดีย์และปีใหม่ (ติงยาน) ที่ชาวบ้านมาร่วมเชียร์วีรบุรุษท้องถิ่น นักสู้ได้รับความเคารพในฐานะแชมป์ของเมือง และชัยชนะนำความภูมิใจมาสู่ทั้งหมู่บ้าน งานใหญ่ในปัจจุบันยังคงบรรยากาศนั้น ทั้งดนตรีสดแบบดั้งเดิม พิธีกรรม และฝูงชน เพียงแต่มีกล้องและผู้ชมทั่วโลกเพิ่มเข้ามา"};
